name: Chart CI

on:
  push:
    branches: [main]
    paths:
      - "chart/**"
      - "Makefile"
      - ".github/workflows/chart-ci.yaml"
  pull_request:
    branches: [main]
    paths:
      - "chart/**"
      - "Makefile"
      - ".github/workflows/chart-ci.yaml"
  workflow_dispatch:

jobs:
  lint-and-validate:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint chart (strict)
        run: make helm-lint

      - name: Validate template rendering
        run: make helm-template

      - name: Validate schema rejects invalid values
        run: make helm-schema

  helm-docs:
    name: Helm Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache helm-docs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/helm-docs
          key: helm-docs-${{ runner.os }}-v1.14.2

      - name: Install helm-docs
        run: |
          if ! command -v helm-docs &>/dev/null; then
            go install github.com/norwoodj/helm-docs/cmd/helm-docs@v1.14.2
          fi

      - name: Check chart/README.md is up to date
        run: make helm-docs-check
